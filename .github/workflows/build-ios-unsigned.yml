
name: Build Bluey iOS unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iPhone app
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project GooglyEyes.xcodeproj \
            -scheme GooglyEyes

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project GooglyEyes.xcodeproj \
            -scheme GooglyEyes \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/BlueyDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      
      - name: Package IPA
        run: |
          APP_PATH="$RUNNER_TEMP/BlueyDerivedData/Build/Products/Release-iphoneos/Bluey.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Bluey.app was not found."
            echo "Available application builds:"
            find "$RUNNER_TEMP/BlueyDerivedData/Build/Products" -name "*.app" -print
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent \
            Payload Bluey-unsigned.ipa

          echo "SUCCESS: Bluey-unsigned.ipa created"

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: Bluey-unsigned-IPA
          path: ${{ runner.temp }}/Bluey-unsigned.ipa
          retention-days: 7
